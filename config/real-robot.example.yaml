# Intentionally non-runnable. Copy this file to real-robot.local.yaml and fill
# every empty onsite value from L Master and the read-only commissioning report.
backend: lebai

real_robot:
  mode: readonly
  ip: ""

  # Read get_tcp() in LEBAI_READONLY and confirm the stock LMG-90 value.
  expected_tcp:
    x: 0.0
    y: 0.0
    z: 0.0
    rz: 0.0
    ry: 0.0
    rx: 0.0

  # Never guess these values. Record and approve them onsite.
  home_q: []
  # A separately approved, collision-free joint pose for Cartesian teleoperation.
  # Keep J3 and J5 at least 5 degrees away from zero.
  teleop_ready_q: []
  soft_joint_min_rad: []
  soft_joint_max_rad: []
  joint_limit_margin_rad: 0.05
  startup_tcp_min_m: []
  startup_tcp_max_m: []

  tcp_position_tolerance_m: 0.001
  tcp_rotation_tolerance_deg: 0.5

  control:
    loop_hz: 50
    state_hz: 25
    pvat_send_hz: 25
    pvat_horizon_s: 0.08
    max_tcp_speed_mps: 0.03
    max_tcp_rotation_radps: 0.25
    max_tcp_acceleration_mps2: 0.10
    max_tcp_angular_acceleration_radps2: 0.5
    max_joint_speed_radps: 0.15
    max_joint_acceleration_radps2: 0.5
    max_joint_step_rad: 0.05
    max_joint_tracking_error_rad: 0.25
    max_tcp_step_m: 0.002
    max_tcp_rotation_step_deg: 1.0
    max_relative_translation_m: 0.10
    max_relative_rotation_deg: 30
    translation_scale: 0.5

  # Determine amplitude direction in LEBAI_READONLY before enabling control.
  gripper:
    max_force_percent: 30
    command_hz: 10
    open_amplitude_percent: 100
    closed_amplitude_percent: 0
